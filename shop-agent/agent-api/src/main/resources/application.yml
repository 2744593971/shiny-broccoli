server:
  address: 127.0.0.1
  port: ${AGENT_PORT:8086}
spring:
  ai:
    model:
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    mcp:
      client:
        name: tik-shop-agent
        type: SYNC
        request-timeout: 15s
        streamable-http:
          connections:
            orders:
              url: ${ORDER_MCP_URL:http://127.0.0.1:8087}
              endpoint: /mcp
