server:
  address: 127.0.0.1
  port: ${AGENT_PORT:8086}
spring:
  ai:
    model:
      embedding: none
    # 使用 Spring AI 的 OpenAI 兼容协议适配器调用阿里云百炼，不向 OpenAI 发送请求。
    # 这里的 openai 是 Spring AI 固定的配置前缀；密钥只读取本机的百炼环境变量。
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        # 百炼 Base URL 已包含 /v1，避免使用适配器默认的 /v1/chat/completions 造成路径重复。
        completions-path: /chat/completions
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
    mcp:
      client:
        name: tik-shop-agent
        type: SYNC
        request-timeout: 15s
        streamable-http:
          connections:
            orders:
              url: ${ORDER_MCP_URL:http://127.0.0.1:8087}
              endpoint: /mcp
